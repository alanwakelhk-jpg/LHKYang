<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberCore - AI Gallery</title>
  
  <!-- 引入 Swiper.js 样式与字体图标 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      /* CSS 动态科技渐变背景 */
      background: linear-gradient(-45deg, #05050d, #081226, #0e051c, #020712);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Canvas 粒子层 */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* 整体展示容器 */
    .showcase-wrapper {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 950px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 毛玻璃展示卡片 */
    .glass-card {
      width: 100%;
      background: rgba(13, 20, 38, 0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid rgba(0, 243, 255, 0.25);
      box-shadow: 0 0 35px rgba(0, 243, 255, 0.15), 
                  inset 0 0 15px rgba(255, 0, 128, 0.1);
      padding: 24px;
      overflow: hidden;
      transition: border-color 0.3s ease;
    }

    .glass-card:hover {
      border-color: rgba(0, 243, 255, 0.5);
    }

    /* Swiper 样式微调 */
    .swiper {
      width: 100%;
      border-radius: 14px;
    }

    .swiper-slide {
      position: relative;
      height: 480px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(105%) saturate(110%);
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .swiper-slide:hover img {
      transform: scale(1.03);
    }

    /* AI 描述信息覆盖层 */
    .ai-badge-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px;
      background: linear-gradient(to top, rgba(3, 5, 12, 0.95), transparent);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ai-tag {
      align-self: flex-start;
      background: linear-gradient(90deg, #00f3ff, #ff007f);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .ai-desc {
      font-size: 14px;
      line-height: 1.5;
      color: #e0e8ff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* 霓虹发光左右按钮 */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(13, 20, 38, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid #00f3ff;
      color: #00f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .nav-btn:hover {
      background: #00f3ff;
      color: #030712;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
      transform: translateY(-50%) scale(1.12);
    }

    .btn-prev { left: -26px; }
    .btn-next { right: -26px; }

    /* 加载中状态样式 */
    .loading-spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      letter-spacing: 2px;
      color: #00f3ff;
      text-shadow: 0 0 10px #00f3ff;
      z-index: 5;
    }
  </style>
</head>
<body>

  <!-- Canvas 粒子背景 -->
  <canvas id="particle-canvas"></canvas>

  <!-- 居中主体卡片 -->
  <div class="showcase-wrapper">
    <div class="loading-spinner" id="loadingText">INITIALIZING SYSTEM...</div>

    <!-- 左右科技感切换按钮 -->
    <button class="nav-btn btn-prev" id="btnPrev" aria-label="Previous">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <button class="nav-btn btn-next" id="btnNext" aria-label="Next">
      <i class="fa-solid fa-chevron-right"></i>
    </button>

    <!-- 毛玻璃外壳 -->
    <div class="glass-card">
      <div class="swiper" id="mainSwiper">
        <div class="swiper-wrapper" id="swiperWrapper">
          <!-- 动态从 API 插入 Swiper Slide -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // ==========================================
    // 1. 原生 Canvas 粒子互联特效 (Particle Network)
    // ==========================================
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.8;
        this.speedX = (Math.random() - 0.5) * 0.8;
        this.speedY = (Math.random() - 0.5) * 0.8;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = 'rgba(0, 243, 255, 0.7)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particlesArray = [];
      const numberOfParticles = Math.floor((canvas.width * canvas.height) / 12000);
      for (let i = 0; i < numberOfParticles; i++) {
        particlesArray.push(new Particle());
      }
    }
    initParticles();
    window.addEventListener('resize', initParticles);

    function connectParticles() {
      for (let a = 0; a < particlesArray.length; a++) {
        for (let b = a; b < particlesArray.length; b++) {
          const dx = particlesArray[a].x - particlesArray[b].x;
          const dy = particlesArray[a].y - particlesArray[b].y;
          const distance = Math.sqrt(dx * dx + dy * dy);

          if (distance < 110) {
            const opacity = 1 - (distance / 110);
            ctx.strokeStyle = `rgba(0, 243, 255, ${opacity * 0.25})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
            ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
            ctx.stroke();
          }
        }
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
      }
      connectParticles();
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ==========================================
    // 2. 初始化轮播与从 Node.js 后端拉取数据
    // ==========================================
    let swiperInstance = null;

    function initSwiper() {
      swiperInstance = new Swiper('#mainSwiper', {
        loop: true,
        speed: 700,
        effect: 'fade',
        fadeEffect: { crossFade: true },
        navigation: {
          nextEl: '#btnNext',
          prevEl: '#btnPrev',
        },
      });
    }

    async function fetchImages() {
      const loading = document.getElementById('loadingText');
      try {
        // 请求 Node.js 后端 API
        const response = await fetch('http://localhost:3000/api/images');
        const result = await response.json();

        if (result.success && result.data.length > 0) {
          const wrapper = document.getElementById('swiperWrapper');
          wrapper.innerHTML = '';

          result.data.forEach(item => {
            const slide = document.createElement('div');
            slide.className = 'swiper-slide';
            slide.innerHTML = `
              <img src="${item.url}" alt="Gallery item" loading="lazy">
              <div class="ai-badge-overlay">
                <span class="ai-tag">Gemini Vision AI</span>
                <p class="ai-desc">${item.aiDescription}</p>
              </div>
            `;
            wrapper.appendChild(slide);
          });

          loading.style.display = 'none';
          initSwiper();
        } else {
          loading.innerText = 'NO DATA RECEIVED';
        }
      } catch (err) {
        console.error('Fetch error:', err);
        loading.innerText = 'CONNECTION ERROR: CHECK BACKEND';
      }
    }

    fetchImages();
  </script>
</body>
</html>
