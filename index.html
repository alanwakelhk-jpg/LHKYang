<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能报表图文视界 | Sci-Fi Report Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            color: #ffffff;
        }

        /* 动态渐变与粒子背景画布 */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* 主容器布局 */
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #b17aff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(79, 172, 254, 0.4);
        }

        header p {
            color: #8b9bb4;
            font-size: 0.95rem;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* 玻璃拟态（Glassmorphism）展示主体 */
        .glass-card {
            position: relative;
            width: 90%;
            max-width: 900px;
            height: 520px;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(79, 172, 254, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 图片轮播视窗 */
        .carousel-viewport {
            width: 100%;
            height: 82%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .carousel-viewport img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }

        .carousel-viewport img:hover {
            transform: scale(1.02);
        }

        /* 底部控制面板 */
        .controls-bar {
            width: 100%;
            height: 18%;
            background: rgba(10, 15, 30, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .info-text {
            font-size: 0.9rem;
            color: #a0aec0;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .sci-btn {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.2), rgba(177, 122, 255, 0.2));
            border: 1px solid rgba(79, 172, 254, 0.4);
            color: #fff;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.1);
        }

        .sci-btn:hover {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.4), rgba(177, 122, 255, 0.4));
            border-color: rgba(79, 172, 254, 0.8);
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            transform: translateY(-2px);
        }

        /* 模态框（点击图片弹出大图查看） */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 50px rgba(79, 172, 254, 0.3);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal.active img {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 动态背景 Canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <h1>AI 报表图文智能视界</h1>
            <p>Report Image Intelligence Extraction & Interactive Presentation</p>
        </header>

        <div class="glass-card">
            <div class="carousel-viewport" id="carouselViewport" title="点击查看大图">
                <!-- 动态注入的图片 -->
                <img id="carouselImg" src="" alt="Report Image">
            </div>
            <div class="controls-bar">
                <div class="info-text" id="infoText">正在加载报表图片...</div>
                <div class="btn-group">
                    <button class="sci-btn" id="prevBtn">上一张</button>
                    <button class="sci-btn" id="nextBtn">下一张</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 全屏灯箱模态框 -->
    <div class="modal" id="imageModal">
        <div class="modal-close" id="modalClose">&times;</div>
        <img id="modalImg" src="" alt="Zoomed Image">
    </div>

    <script>
        // ==================== 1. 动态渐变背景与粒子特效 (Canvas) ====================
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const numParticles = 45;

        for (let i = 0; i < numParticles; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4,
                alpha: Math.random() * 0.5 + 0.2
            });
        }

        let hue = 220;
        function drawBackground() {
            // 动态流光渐变背景
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#030712');
            gradient.addColorStop(0.5, '#0b132b');
            gradient.addColorStop(1, '#1c103b');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制漂浮连接粒子
            ctx.lineWidth = 0.5;
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(147, 197, 253, ${p.alpha})`;
                ctx.fill();

                // 连线近距离粒子
                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                    if (dist < 120) {
                        ctx.strokeStyle = `rgba(167, 139, 250, ${0.15 * (1 - dist / 120)})`;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawBackground);
        }
        drawBackground();

        // ==================== 2. 前端业务逻辑（轮播与交互） ====================
        // 模拟从后端 API 获取的报表图片列表（实际项目中通过 fetch('/api/report-images') 替代）
        const mockReportImages = [
            { id: 1, url: 'https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1200&q=80', title: 'Q3 业务营收综合增长曲线图' },
            { id: 2, url: 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1200&q=80', title: '多维数据资产流向热力分析图' },
            { id: 3, url: 'https://images.unsplash.com/photo-1504868584819-f8e8b4b6d7e3?auto=format&fit=crop&w=1200&q=80', title: 'AI 供应链成本预测柱状报表' },
            { id: 4, url: 'https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&w=1200&q=80', title: '用户行为路径转化漏斗模型' }
        ];

        let currentIndex = 0;
        let slideTimer = null;

        const carouselImg = document.getElementById('carouselImg');
        const infoText = document.getElementById('infoText');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const carouselViewport = document.getElementById('carouselViewport');
        const imageModal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const modalClose = document.getElementById('modalClose');

        function updateSlide(index, direction = 'next') {
            // 添加简单淡入淡出动画过渡
            carouselImg.style.opacity = 0;
            setTimeout(() => {
                currentIndex = (index + mockReportImages.length) % mockReportImages.length;
                const currentItem = mockReportImages[currentIndex];
                carouselImg.src = currentItem.url;
                infoText.textContent = `[图 ${currentIndex + 1} / ${mockReportImages.length}] ${currentItem.title}`;
                carouselImg.style.opacity = 1;
            }, 200);
        }

        function nextSlide() {
            updateSlide(currentIndex + 1, 'next');
        }

        function prevSlide() {
            updateSlide(currentIndex - 1, 'prev');
        }

        // 自动轮播定时器（每 5 秒切换）
        function startAutoPlay() {
            slideTimer = setInterval(nextSlide, 5000);
        }

        function stopAutoPlay() {
            clearInterval(slideTimer);
        }

        // 事件绑定
        nextBtn.addEventListener('click', () => { nextSlide(); stopAutoPlay(); startAutoPlay(); });
        prevBtn.addEventListener('click', () => { prevSlide(); stopAutoPlay(); startAutoPlay(); });

        // 点击图片放大（Lightbox 效果）
        carouselViewport.addEventListener('click', () => {
            modalImg.src = mockReportImages[currentIndex].url;
            imageModal.classList.add('active');
            stopAutoPlay();
        });

        modalClose.addEventListener('click', () => {
            imageModal.classList.remove('active');
            startAutoPlay();
        });

        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.classList.remove('active');
                startAutoPlay();
            }
        });

        // 初始化加载
        updateSlide(0);
        startAutoPlay();
    </script>
</body>
</html>
