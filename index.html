<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlanWake|Yang的资源库 | Sci-Fi Report Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            /* 引入 AI 生成的赛博朋克背景底图 */
            background-image: url('lucid-origin_A_futuristic_cyberpunk_background_deep_dark_blue_and_neon_purple_gradient_glowin-0.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #ffffff;
        }

        /* 动态粒子特效画布层（叠加在背景图上） */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* 主容器布局 */
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #b17aff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(79, 172, 254, 0.4);
        }

        header p {
            color: #8b9bb4;
            font-size: 0.95rem;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        /* 玻璃拟态（Glassmorphism）展示主体 */
        .glass-card {
            position: relative;
            width: 90%;
            max-width: 900px;
            height: 520px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(79, 172, 254, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: zoomIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* 图片轮播视窗 */
        .carousel-viewport {
            width: 100%;
            height: 82%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .carousel-viewport img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
        }

        .carousel-viewport img:hover {
            transform: scale(1.02);
        }

        /* 底部控制面板 */
        .controls-bar {
            width: 100%;
            height: 18%;
            background: rgba(10, 15, 30, 0.5);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .info-text {
            font-size: 0.9rem;
            color: #cbd5e1;
            letter-spacing: 0.5px;
        }

        .right-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .sci-btn {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.25), rgba(177, 122, 255, 0.25));
            border: 1px solid rgba(79, 172, 254, 0.4);
            color: #fff;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.1);
        }

        .sci-btn:hover {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.45), rgba(177, 122, 255, 0.45));
            border-color: rgba(79, 172, 254, 0.8);
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            transform: translateY(-2px);
        }

        /* X (Twitter) 科技感社交图标样式 */
        .x-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .x-link svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            transition: fill 0.3s ease;
        }

        .x-link:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
            transform: translateY(-2px) scale(1.05);
        }

        .x-link:hover svg {
            fill: #00f2fe;
        }

        /* 模态框（点击图片弹出大图查看） */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 7, 18, 0.88);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal img {
            max-width: 85%;
            max-height: 85%;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 50px rgba(79, 172, 254, 0.3);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .modal.active img {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 动态背景粒子特效 Canvas -->
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <header>
            <h1>AlanWake|Yang的资源库</h1>
            <p>Report Image Intelligence Extraction & Interactive Presentation</p>
        </header>

        <div class="glass-card">
            <div class="carousel-viewport" id="carouselViewport" title="点击查看大图">
                <!-- 动态注入的图片 -->
                <img id="carouselImg" src="" alt="Report Image">
            </div>
            <div class="controls-bar">
